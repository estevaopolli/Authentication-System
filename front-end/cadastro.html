<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <script src="js/validateSignup.js" type="module" defer></script>
    <title>Cadastro</title>
</head>
<body>
    <div id="signup-box" class="form-container">
        <div id="title-signup">
            <h1>Registre-se</h1>
        </div>
        <div>
            <form id="signupForm">
                <label for="username">Nome</label> <br>
                <input type="text" id="username" name="username" placeholder="Digite seu nome" required> <br>
                <div class="error" id="invalid-user-error">Informe um nome válido!</div>
                <div class="error" id="used-user-error">Esse usuário já existe</div>

                <label for="email">E-mail</label> <br>
                <input type="text" id="email" name="email" placeholder="Digite seu E-mail" required> <br>
                <div class="error" id="invalid-email-error">Informe um E-mail válido!</div>
                <div class="error" id="used-email-error">E-mail já cadastrado</div>

                <label for="password">Senha</label> <br>
                <input type="password" id="password" name="password" placeholder="Digite sua senha" required> <br>
                <div class="error" id="invalid-password-error">Senha inválida!</div>

                <button id="signup-button" class="button-solid" type="submit">Cadastre-se</button>
            </form>
        </div>
        <div class="forms-link">
            <p>Já tem uma conta?</p>
            <a href="login.html">Entre</a>
        </div>
    </div>
</body>
</html>
