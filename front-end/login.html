<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <script src="js/validateLogin.js" type="module" defer></script>
    <title>Login</title>
</head>
<body>
    <div class="form-container">
        <div>
            <h1>Login</h1>
        </div>
        <div>
            <form id="loginForm">
                <label for="email">Email</label> <br>
                <input type="text" name="email" id="email"> <br> <br>
                <label for="password">Password</label> <br>
                <input type="password" name="password" id="password"> <br> 

                <div class="error" id="incorrect-credentials-error">E-mail ou senha incorretos</div> <br>
                <button id="login-button" class="button-solid" type="submit">Entrar</button>

            </form> 
        </div>
        <div class="signup-link">
            <a href="cadastro.html">Ainda não tem uma conta? <br> Cadastre-se</a>
        </div>
    </div>
</body>
</html>
