<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <script src="js/validateLogin.js" type="module" defer></script>
    <title>Login</title>
</head>
<body>
    <div class="form-container">
        <div>
            <h1>Entrar</h1>
        </div>
        <div>
            <form id="loginForm">
                <label for="email">E-mail</label> <br>
                <input type="text" name="email" id="email" placeholder="Digite seu E-mail"> <br>
                <label for="password">Senha</label> <br>
                <input type="password" name="password" id="password" placeholder="Digite sua senha">

                <div class="error" id="incorrect-credentials-error">E-mail ou senha incorretos</div> <br>
                <button id="login-button" class="button-solid" type="submit">Entrar</button>

            </form> 
        </div>
        <div class="forms-link">
            <a href="recuperar.html" class="forgotPassword-link">Esqueceu sua senha?</a> <br>
            <p>Não tem uma conta?</p>
            <a href="cadastro.html" class="signup-link">Cadastre-se</a>
        </div>
    </div>
</body>
</html>
